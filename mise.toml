[tools]
go = "latest"
powershell = "latest"

[env]
# ConnectionStrings__AppDbContext = "Host=localhost; Username=postgres; Password=postgres; Database=fufood_dev; Port=5432"
PGPORT = "5487"
PGUSER = "postgres"
PGPASSWORD = "postgres"
PGHOST = "localhost"
PGDATABASE = "fufood_dev"

[tasks.token]
shell = "pwsh -NoProfile -Command"
run = """
cd ./FuFood/scripts/issue_access_token

if (-not $IsWindows) {
  $value = go run .
} else {
  $binary = "app.exe"
  if (-not (Test-Path $binary)) {
    go build -o $binary .
  }
  $value = ./app.exe
}

write-host $value
$value | set-clipboard
"""
